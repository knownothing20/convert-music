<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>音乐转换</title>
<meta name="description" content="在本地把 .ncm 还原成 MP3 / FLAC，文件不上传。" />
<meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0d0f14" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="音乐转换" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<link rel="icon" type="image/png" sizes="32x32" href="img/icons/favicon-32x32.png" />
<link rel="apple-touch-icon" href="img/icons/apple-touch-icon-152x152.png" />
<link rel="manifest" href="manifest.json" />
<style>
  /* ============================================================
     设计系统
     ============================================================ */
  :root {
    /* 纸感中性色：暖白底 + 近黑文字，强调色只用砖红做点缀 */
    --bg: #f6f4ef;
    --surface: #ffffff;
    --surface-2: #f4f2ed;
    --text: #17150f;
    --text-2: #6b655c;
    --text-3: #a39c92;
    --line: #e6e2da;
    --line-strong: #d4cec3;
    --primary: #b23a26;
    --primary-2: #8c2a18;
    --primary-ink: #ffffff;
    --primary-soft: #f7ede9;
    --ok: #1f6b45;
    --ok-soft: #eaf3ee;
    --err: #b3271e;
    --err-soft: #f8e9e7;
    --warn: #96601a;
    --radius-lg: 14px;
    --radius: 10px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(23, 21, 15, .05);
    --shadow-lift: 0 2px 10px rgba(23, 21, 15, .08);
    --dock-bg: rgba(246, 244, 239, .9);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #100f0d;
      --surface: #191715;
      --surface-2: #211e1a;
      --text: #f2efe9;
      --text-2: #a29b91;
      --text-3: #6e675e;
      --line: #2a2622;
      --line-strong: #3a352f;
      --primary: #e2654a;
      --primary-2: #c94f35;
      --primary-soft: #2a1c18;
      --ok: #4fbf8b;
      --ok-soft: #16241d;
      --err: #ff7a6b;
      --err-soft: #2a1815;
      --shadow: 0 1px 2px rgba(0, 0, 0, .4);
      --shadow-lift: 0 2px 8px rgba(0, 0, 0, .5);
      --dock-bg: rgba(16, 15, 13, .9);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow-x: hidden; max-width: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow-x: hidden;
  }

  /* 不用彩色背景光晕：柔和光斑是 AI 模板感的主要来源，纯色底更耐看 */

  .app {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: calc(26px + env(safe-area-inset-top)) 18px 190px;
  }

  /* ============================================================
     顶部
     ============================================================ */
  header { margin-bottom: 22px; }

  /* 顶部标注：去掉彩色胶囊，只留一个小圆点 + 灰字 */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .02em;
    color: var(--text-3);
    background: none;
    padding: 0;
    margin-bottom: 14px;
  }
  .eyebrow .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--primary);
  }

  h1 {
    margin: 0 0 8px;
    font-size: 29px;
    line-height: 1.24;
    letter-spacing: -.7px;
    font-weight: 700;
  }
  h1 em {
    font-style: normal;
    color: var(--primary);
  }
  .lede {
    margin: 0;
    color: var(--text-2);
    font-size: 14px;
  }

  /* ============================================================
     拖放区
     ============================================================ */
  .drop {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    padding: 34px 22px 30px;
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: center;
    transition: border-color .18s, background .18s, transform .18s, box-shadow .18s;
  }
  .drop:hover { border-color: var(--line-strong); background: var(--surface-2); }
  .drop:active { transform: scale(.995); }
  .drop.over {
    border-color: var(--text);
    background: var(--surface-2);
    box-shadow: none;
  }
  .drop-icon {
    width: 54px; height: 54px;
    display: grid; place-items: center;
    border-radius: 12px;
    background: var(--surface-2);
    color: var(--text-2);
    margin-bottom: 9px;
    transition: transform .2s;
  }
  .drop.over .drop-icon { transform: translateY(-3px) scale(1.05); }
  .drop-title { font-size: 15.5px; font-weight: 650; }
  .drop-hint { font-size: 12.5px; color: var(--text-3); }
  .drop-cta {
    margin-top: 14px;
    display: flex; gap: 9px; flex-wrap: wrap; justify-content: center;
  }

  /* ============================================================
     按钮
     ============================================================ */
  .btn {
    appearance: none;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 17px;
    border-radius: 9px;
    cursor: pointer;
    transition: .16s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) { border-color: var(--line-strong); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(0) scale(.985); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .btn.primary {
    background: var(--text);
    border: 1px solid var(--text);
    color: var(--bg);
    box-shadow: none;
  }
  .btn.primary:hover:not(:disabled) {
    background: var(--text-2);
    border-color: var(--text-2);
  }

  .btn.quiet {
    border-color: transparent;
    background: transparent;
    color: var(--text-2);
  }
  .btn.quiet:hover:not(:disabled) { background: var(--surface-2); color: var(--text); }

  /* ============================================================
     文件列表
     ============================================================ */
  .panel {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 15px 18px;
    border-bottom: 1px solid var(--line);
  }
  .panel-head .t { font-size: 14px; font-weight: 650; }
  .panel-head .c { font-size: 12.5px; color: var(--text-3); }

  /* 整页滚动，避免列表内层滚动 + 固定底栏造成的双层滚动与遮挡 */
  .rows { overflow: visible; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    animation: rise .28s cubic-bezier(.2, .7, .3, 1) both;
  }
  .row:last-child { border-bottom: none; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: none; }
  }

  .tag {
    flex: none;
    width: 46px;
    padding: 5px 0;
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: .5px;
    border-radius: 8px;
    background: var(--surface-2);
    color: var(--text-3);
    border: 1px solid var(--line);
  }
  .tag.flac { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.mp3  { background: var(--primary-soft); color: var(--primary); border-color: transparent; }

  .meta { flex: 1; min-width: 0; }
  .meta .n {
    font-size: 13.5px;
    font-weight: 550;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .s {
    font-size: 11.5px;
    color: var(--text-3);
    margin-top: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .meta .s.bad {
    color: var(--err);
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    line-height: 1.45;
    word-break: break-word;
  }

  .state {
    flex: none;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    min-width: 42px;
    text-align: right;
  }
  .state.ok { color: var(--ok); }
  .state.bad { color: var(--err); }
  .state.run { color: var(--primary); }

  .spin {
    display: inline-block;
    width: 12px; height: 12px;
    border: 2px solid var(--line-strong);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: rot .7s linear infinite;
    vertical-align: -2px;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  /* ============================================================
     底部操作栏
     ============================================================ */
  .dock {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 20;
    padding: 12px 18px calc(12px + env(safe-area-inset-bottom));
    background: var(--dock-bg);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    backdrop-filter: blur(18px) saturate(160%);
    border-top: 1px solid var(--line);
    transition: transform .26s cubic-bezier(.2, .7, .3, 1), opacity .2s;
  }
  .dock.hide { transform: translateY(110%); opacity: 0; pointer-events: none; }

  .dock-inner { max-width: 680px; margin: 0 auto; }

  .bar {
    height: 3px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
    margin-bottom: 11px;
    opacity: 0;
    transition: opacity .2s;
  }
  .bar.show { opacity: 1; }
  .bar > i {
    display: block;
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: var(--primary);
    transition: width .22s ease;
  }

  .dock-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .dock-info { flex: 1; min-width: 0; }
  .dock-info .a {
    font-size: 13.5px;
    font-weight: 650;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dock-info .b { font-size: 11.5px; color: var(--text-3); }

  .dock .btn.primary {
    min-width: 132px;
    height: 46px;
    font-size: 14.5px;
    border-radius: 10px;
  }

  /* ============================================================
     空状态 / 说明
     ============================================================ */
  .notes {
    margin-top: 26px;
    padding: 0 4px;
  }
  .note {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    font-size: 12.5px;
    color: var(--text-3);
    line-height: 1.65;
    margin-bottom: 9px;
  }
  .note svg { flex: none; margin-top: 3px; opacity: .8; }
  .note b { color: var(--text-2); font-weight: 600; }

  .hidden { display: none !important; }

  @media (max-width: 420px) {
    h1 { font-size: 25px; }
    .app { padding-left: 15px; padding-right: 15px; }
    .dock { padding-left: 15px; padding-right: 15px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <span class="eyebrow"><span class="dot"></span>本地处理 · 不上传</span>
    <h1>把 .ncm 变成<br /><em>能播的音频</em></h1>
    <p class="lede">自动识别原始格式，是 FLAC 就还原 FLAC，是 MP3 就还原 MP3，零转码、零损失。</p>
  </header>

  <div class="drop" id="drop">
    <div class="drop-icon">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 15.5V4m0 0L7.8 8.2M12 4l4.2 4.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M4 15.2v3.1A1.7 1.7 0 0 0 5.7 20h12.6a1.7 1.7 0 0 0 1.7-1.7v-3.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="drop-title">拖入文件，或点这里选择</div>
    <div class="drop-hint">支持批量；桌面端可直接拖文件夹</div>
    <div class="drop-cta">
      <button class="btn primary" id="pickFiles" type="button">选择文件</button>
      <button class="btn" id="pickDir" type="button">选择文件夹</button>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".ncm" multiple hidden />
  <input type="file" id="dirInput" webkitdirectory directory multiple hidden />

  <section class="panel hidden" id="panel">
    <div class="panel-head">
      <span class="t">文件</span>
      <span class="c" id="count"></span>
    </div>
    <div class="rows" id="rows"></div>
  </section>

  <div class="notes">
    <div class="note">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v4M8 5.2v.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span><b>为什么不做「统一转 MP3」</b>：FLAC 压成 MP3 属于二次有损压缩，音质只会更差。所以这里只还原，不转码。</span>
    </div>
    <div class="note">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.4" stroke="currentColor" stroke-width="1.3"/><path d="M8 7.2v4M8 5.2v.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <span>全部运算在浏览器内完成，文件不会上传到任何服务器。多格式支持请看 <a href="classic/" style="color:var(--primary)">经典版</a>。</span>
    </div>
  </div>
</div>

<div class="dock hide" id="dock">
  <div class="dock-inner">
    <div class="bar" id="bar"><i id="barFill"></i></div>
    <div class="dock-row">
      <div class="dock-info">
        <div class="a" id="dockTitle">准备就绪</div>
        <div class="b" id="dockSub"></div>
      </div>
      <button class="btn quiet" id="clearBtn" type="button">清空</button>
      <button class="btn primary" id="actionBtn" type="button">开始转换</button>
    </div>
  </div>
</div>

<script>
"use strict";

/* ------------------------------------------------------------
   清理历史遗留的 Service Worker 与缓存。
   旧版页面注册过 SW 并 precache 了整个页面，会导致浏览器一直
   返回缓存的旧界面、看不到新版本。这里主动注销并清空缓存。
   ------------------------------------------------------------ */
(function cleanupLegacyServiceWorker() {
  try {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) { regs.forEach(function (r) { r.unregister(); }); })
        .catch(function () {});
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (keys) { keys.forEach(function (k) { caches.delete(k); }); })
        .catch(function () {});
    }
  } catch (e) { /* 忽略：清理失败不应影响主流程 */ }
})();

/* ============================================================
   1. AES-128 ECB 解密（纯 JS 实现，浏览器原生 WebCrypto 不支持 ECB）
   ============================================================ */
const AES = (() => {
  const SBOX = new Uint8Array(256);
  const INV = new Uint8Array(256);

  (function init() {
    const rotl8 = (x, n) => ((x << n) | (x >>> (8 - n))) & 0xff;
    let p = 1, q = 1;
    do {
      p = (p ^ (p << 1) ^ ((p & 0x80) ? 0x1b : 0)) & 0xff;
      q ^= q << 1; q ^= q << 2; q ^= q << 4; q &= 0xff;
      if (q & 0x80) q ^= 0x09;
      const x = q ^ rotl8(q, 1) ^ rotl8(q, 2) ^ rotl8(q, 3) ^ rotl8(q, 4);
      SBOX[p] = (x ^ 0x63) & 0xff;
    } while (p !== 1);
    SBOX[0] = 0x63;
    for (let i = 0; i < 256; i++) INV[SBOX[i]] = i;
  })();

  const xtime = (b) => ((b << 1) ^ ((b & 0x80) ? 0x1b : 0)) & 0xff;

  function gmul(a, b) {
    let r = 0;
    for (let i = 0; i < 8; i++) {
      if (b & 1) r ^= a;
      const hi = a & 0x80;
      a = (a << 1) & 0xff;
      if (hi) a ^= 0x1b;
      b >>= 1;
    }
    return r & 0xff;
  }

  function expandKey(key) {
    const w = new Uint8Array(176);
    w.set(key, 0);
    let rcon = 1;
    for (let i = 16; i < 176; i += 4) {
      let t0 = w[i - 4], t1 = w[i - 3], t2 = w[i - 2], t3 = w[i - 1];
      if (i % 16 === 0) {
        const tmp = t0;
        t0 = SBOX[t1] ^ rcon; t1 = SBOX[t2]; t2 = SBOX[t3]; t3 = SBOX[tmp];
        rcon = xtime(rcon);
      }
      w[i] = w[i - 16] ^ t0; w[i + 1] = w[i - 15] ^ t1;
      w[i + 2] = w[i - 14] ^ t2; w[i + 3] = w[i - 13] ^ t3;
    }
    return w;
  }

  function decryptBlock(w, input, out, off) {
    const s = new Uint8Array(16);
    for (let i = 0; i < 16; i++) s[i] = input[i] ^ w[160 + i];
    for (let round = 9; round >= 1; round--) {
      const t = s.slice();
      s[0] = t[0]; s[4] = t[4]; s[8] = t[8]; s[12] = t[12];
      s[1] = t[13]; s[5] = t[1]; s[9] = t[5]; s[13] = t[9];
      s[2] = t[10]; s[6] = t[14]; s[10] = t[2]; s[14] = t[6];
      s[3] = t[7]; s[7] = t[11]; s[11] = t[15]; s[15] = t[3];
      for (let i = 0; i < 16; i++) s[i] = INV[s[i]];
      for (let i = 0; i < 16; i++) s[i] ^= w[round * 16 + i];
      for (let c = 0; c < 4; c++) {
        const b = c * 4;
        const a0 = s[b], a1 = s[b + 1], a2 = s[b + 2], a3 = s[b + 3];
        s[b] = gmul(a0, 14) ^ gmul(a1, 11) ^ gmul(a2, 13) ^ gmul(a3, 9);
        s[b + 1] = gmul(a0, 9) ^ gmul(a1, 14) ^ gmul(a2, 11) ^ gmul(a3, 13);
        s[b + 2] = gmul(a0, 13) ^ gmul(a1, 9) ^ gmul(a2, 14) ^ gmul(a3, 11);
        s[b + 3] = gmul(a0, 11) ^ gmul(a1, 13) ^ gmul(a2, 9) ^ gmul(a3, 14);
      }
    }
    const t = s.slice();
    s[0] = t[0]; s[4] = t[4]; s[8] = t[8]; s[12] = t[12];
    s[1] = t[13]; s[5] = t[1]; s[9] = t[5]; s[13] = t[9];
    s[2] = t[10]; s[6] = t[14]; s[10] = t[2]; s[14] = t[6];
    s[3] = t[7]; s[7] = t[11]; s[11] = t[15]; s[15] = t[3];
    for (let i = 0; i < 16; i++) s[i] = INV[s[i]];
    for (let i = 0; i < 16; i++) s[i] ^= w[i];
    out.set(s, off);
  }

  function decryptECB(key, data) {
    if (data.length % 16 !== 0) throw new Error("密文长度异常");
    const w = expandKey(key);
    const out = new Uint8Array(data.length);
    for (let i = 0; i < data.length; i += 16) decryptBlock(w, data.subarray(i, i + 16), out, i);
    return out;
  }

  return { decryptECB };
})();

/* ============================================================
   2. NCM 容器解析（结构与算法已用真实格式样本逐字节验证）
   ============================================================ */
const NCM = (() => {
  const CORE_KEY = hexToBytes("687A4852416D736F356B496E62617857");
  const META_KEY = hexToBytes("2331346C6A6B5F215C5D2630553C2728");
  const MAGIC = "CTENFDAM";
  const KEY_PREFIX = "neteasecloudmusic";

  function hexToBytes(hex) {
    const out = new Uint8Array(hex.length / 2);
    for (let i = 0; i < out.length; i++) out[i] = parseInt(hex.substr(i * 2, 2), 16);
    return out;
  }
  const u32 = (b, o) => (b[o] | (b[o + 1] << 8) | (b[o + 2] << 16) | (b[o + 3] << 24)) >>> 0;
  const textAt = (b, o, n) => {
    if (o + n > b.length) return "";
    let s = "";
    for (let i = 0; i < n; i++) s += String.fromCharCode(b[o + i]);
    return s;
  };
  function unpad(buf) {
    if (!buf.length) return buf;
    const n = buf[buf.length - 1];
    if (n === 0 || n > 16 || n > buf.length) return buf;
    return buf.subarray(0, buf.length - n);
  }
  function b64ToBytes(b64) {
    const clean = b64.replace(/[^A-Za-z0-9+/=]/g, "");
    const bin = atob(clean);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function sniff(b) {
    if (!b || b.length < 4) return null;
    if (b[0] === 0x66 && b[1] === 0x4c && b[2] === 0x61 && b[3] === 0x43) return "flac";
    if (b[0] === 0x49 && b[1] === 0x44 && b[2] === 0x33) return "mp3";
    if (b[0] === 0xff && (b[1] & 0xe0) === 0xe0) return "mp3";
    if (b[0] === 0x4f && b[1] === 0x67 && b[2] === 0x67 && b[3] === 0x53) return "ogg";
    if (b[0] === 0x52 && b[1] === 0x49 && b[2] === 0x46 && b[3] === 0x46) return "wav";
    if (b[0] === 0x30 && b[1] === 0x26 && b[2] === 0xb2 && b[3] === 0x75) return "wma";
    if (b[0] === 0x66 && b[1] === 0x74 && b[2] === 0x79 && b[3] === 0x70) return "m4a";
    if (b[0] === 0x4d && b[1] === 0x41 && b[2] === 0x43 && b[3] === 0x20) return "ape";
    return null;
  }
  function keyBox(key) {
    const box = new Uint8Array(256);
    for (let i = 0; i < 256; i++) box[i] = i;
    let c = 0, last = 0, ko = 0;
    for (let i = 0; i < 256; i++) {
      const swap = box[i];
      c = (swap + last + key[ko]) & 0xff;
      ko++; if (ko >= key.length) ko = 0;
      box[i] = box[c]; box[c] = swap; last = c;
    }
    return box;
  }
  function keyStream(box) {
    const ks = new Uint8Array(256);
    for (let k = 0; k < 256; k++) {
      const j = (k + 1) & 0xff;
      ks[k] = box[(box[j] + box[(box[j] + j) & 0xff]) & 0xff];
    }
    return ks;
  }
  function decodeMeta(raw) {
    if (raw.length <= 22) return null;
    try {
      const b64 = new TextDecoder().decode(raw.subarray(22));
      const plain = unpad(AES.decryptECB(META_KEY, b64ToBytes(b64)));
      return JSON.parse(new TextDecoder().decode(plain).slice(6));
    } catch (e) { return null; }
  }

  async function decode(arrayBuffer, onProgress) {
    const u8 = new Uint8Array(arrayBuffer);
    if (u8.length < 64) throw new Error("文件太小，不是有效的 NCM");
    if (textAt(u8, 0, 8) !== MAGIC) throw new Error("不是 NCM 文件（文件头不匹配）");

    let pos = 10;
    const keyLen = u32(u8, pos); pos += 4;
    if (keyLen === 0 || keyLen > 4096 || pos + keyLen > u8.length) throw new Error("密钥段异常，文件可能损坏");

    const keyCipher = u8.slice(pos, pos + keyLen); pos += keyLen;
    for (let i = 0; i < keyCipher.length; i++) keyCipher[i] ^= 0x64;

    const keyPlain = unpad(AES.decryptECB(CORE_KEY, keyCipher));
    if (textAt(keyPlain, 0, 17) !== KEY_PREFIX) throw new Error("密钥校验失败，文件已损坏");
    const rc4Key = keyPlain.slice(17);
    if (!rc4Key.length) throw new Error("密钥为空");

    const ks = keyStream(keyBox(rc4Key));

    let meta = null;
    if (pos + 4 <= u8.length) {
      const metaLen = u32(u8, pos); pos += 4;
      if (metaLen > 0 && pos + metaLen <= u8.length) {
        const raw = u8.slice(pos, pos + metaLen);
        for (let i = 0; i < raw.length; i++) raw[i] ^= 0x63;
        meta = decodeMeta(raw);
        pos += metaLen;
      }
    }

    pos += 9; // crc32(4) + gap(5)

    let cover = null;
    if (pos + 4 <= u8.length) {
      const imgSize = u32(u8, pos);
      if (imgSize > 0 && imgSize <= u8.length - pos - 4) {
        cover = u8.slice(pos + 4, pos + 4 + imgSize);
        pos += 4 + imgSize;
      } else {
        pos += 4;
      }
    }

    const probe = (p) => {
      if (p < 0 || p + 4 > u8.length) return null;
      const t = new Uint8Array(4);
      for (let i = 0; i < 4; i++) t[i] = u8[p + i] ^ ks[i];
      return sniff(t);
    };

    let start = -1;
    if (probe(pos)) start = pos;
    else {
      for (let d = -32; d <= 32; d++) { if (probe(pos + d)) { start = pos + d; break; } }
    }
    if (start < 0) throw new Error("无法解析该文件结构");
    if (start + 1024 > u8.length) throw new Error("文件不完整，可能未下载完");

    const total = u8.length - start;
    const out = new Uint8Array(total);
    const STEP = 1 << 20;
    const src = u8.subarray(start);

    for (let off = 0; off < total; off += STEP) {
      const end = Math.min(off + STEP, total);
      for (let k = off; k < end; k++) out[k] = src[k] ^ ks[k & 0xff];
      if (onProgress) onProgress(end / total);
      await new Promise((r) => setTimeout(r, 0));
    }

    let format = sniff(out.subarray(0, 4)) || (meta && String(meta.format || "").toLowerCase()) || "bin";
    return { format, data: out, meta, cover };
  }

  return { decode };
})();

/* ============================================================
   3. ZIP 打包（store 模式，音频已压缩，无需二次压缩）
   ============================================================ */
const Zip = (() => {
  const T = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();

  function crc32(buf) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < buf.length; i++) c = T[(c ^ buf[i]) & 0xff] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }

  function build(entries) {
    const enc = new TextEncoder();
    const parts = [], central = [];
    let offset = 0;

    for (const e of entries) {
      const name = enc.encode(e.name);
      const crc = crc32(e.data);
      const size = e.data.length;

      const lh = new Uint8Array(30 + name.length);
      const dv = new DataView(lh.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0x0800, true);
      dv.setUint16(8, 0, true);
      dv.setUint16(12, 0x21, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, name.length, true);
      lh.set(name, 30);
      parts.push(lh, e.data);

      const ch = new Uint8Array(46 + name.length);
      const cdv = new DataView(ch.buffer);
      cdv.setUint32(0, 0x02014b50, true);
      cdv.setUint16(4, 20, true);
      cdv.setUint16(6, 20, true);
      cdv.setUint16(8, 0x0800, true);
      cdv.setUint16(14, 0x21, true);
      cdv.setUint32(16, crc, true);
      cdv.setUint32(20, size, true);
      cdv.setUint32(24, size, true);
      cdv.setUint16(28, name.length, true);
      cdv.setUint32(42, offset, true);
      ch.set(name, 46);
      central.push(ch);

      offset += lh.length + size;
    }

    const cdStart = offset;
    let cdSize = 0;
    for (const c of central) cdSize += c.length;

    const eocd = new Uint8Array(22);
    const edv = new DataView(eocd.buffer);
    edv.setUint32(0, 0x06054b50, true);
    edv.setUint16(8, entries.length, true);
    edv.setUint16(10, entries.length, true);
    edv.setUint32(12, cdSize, true);
    edv.setUint32(16, cdStart, true);

    return new Blob([...parts, ...central, eocd], { type: "application/zip" });
  }

  return { build };
})();

/* ============================================================
   4. 界面
   ============================================================ */
(function UI() {
  const $ = (id) => document.getElementById(id);
  const drop = $("drop"), fileInput = $("fileInput"), dirInput = $("dirInput");
  const panel = $("panel"), rowsEl = $("rows"), countEl = $("count");
  const dock = $("dock"), bar = $("bar"), barFill = $("barFill");
  const dockTitle = $("dockTitle"), dockSub = $("dockSub");
  const actionBtn = $("actionBtn"), clearBtn = $("clearBtn");

  let items = [];
  let uid = 0;
  let busy = false;
  let lastRunHadOutput = false;

  const fmtSize = (n) => {
    if (n < 1024) return n + " B";
    if (n < 1048576) return (n / 1024).toFixed(0) + " KB";
    if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
    return (n / 1073741824).toFixed(2) + " GB";
  };
  const sanitize = (s) => {
    let r = String(s || "").replace(/[\\/:*?"<>|\u0000-\u001f]/g, "_").replace(/\s+/g, " ").trim();
    if (r.length > 100) r = r.slice(0, 100);
    return r || "audio";
  };
  const artistsOf = (meta) => {
    if (!meta || !Array.isArray(meta.artist)) return [];
    const out = [];
    for (const a of meta.artist) {
      if (Array.isArray(a) && a[0]) out.push(String(a[0]));
      else if (typeof a === "string" && a) out.push(a);
    }
    return out;
  };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  function render() {
    const has = items.length > 0;
    panel.classList.toggle("hidden", !has);
    dock.classList.toggle("hide", !has);
    if (!has) { rowsEl.innerHTML = ""; countEl.textContent = ""; return; }

    const done = items.filter((i) => i.state === "done").length;
    const bad = items.filter((i) => i.state === "error").length;
    const totalSize = items.reduce((a, b) => a + b.size, 0);

    countEl.textContent = `${items.length} 个 · ${fmtSize(totalSize)}` + (bad ? ` · 失败 ${bad}` : "");

    rowsEl.innerHTML = items.map((it) => {
      const tagCls = it.format === "flac" ? "flac" : it.format === "mp3" ? "mp3" : "";
      const tagTxt = it.format ? it.format.toUpperCase() : "NCM";
      let stateHtml = "";
      if (it.state === "running") stateHtml = `<span class="state run"><span class="spin"></span> ${Math.round(it.progress * 100)}%</span>`;
      else if (it.state === "done") stateHtml = `<span class="state ok">完成</span>`;
      else if (it.state === "error") stateHtml = `<span class="state bad">失败</span>`;
      else stateHtml = `<span class="state">待处理</span>`;

      const sub = it.state === "error"
        ? `<div class="s bad">${esc(it.err || "未知错误")}</div>`
        : `<div class="s">${fmtSize(it.size)}${it.outName ? " · " + esc(it.outName) : ""}</div>`;

      return `<div class="row">
        <div class="tag ${tagCls}">${tagTxt}</div>
        <div class="meta"><div class="n">${esc(it.name)}</div>${sub}</div>
        ${stateHtml}
      </div>`;
    }).join("");

    if (busy) {
      actionBtn.disabled = true;
    } else if (done > 0) {
      actionBtn.disabled = false;
      actionBtn.textContent = done === 1 && items.length === 1 ? "下载文件" : `下载全部 (${done})`;
    } else {
      actionBtn.disabled = false;
      actionBtn.textContent = "开始转换";
    }
  }

  function setBar(v) {
    bar.classList.toggle("show", v > 0 && v < 1);
    barFill.style.width = Math.round(v * 100) + "%";
  }

  function addFiles(list) {
    const accepted = [];
    let skipped = 0;
    for (const f of list) {
      if (!/\.ncm$/i.test(f.name)) { skipped++; continue; }
      if (items.some((i) => i.name === f.name && i.size === f.size)) { skipped++; continue; }
      accepted.push(f);
    }
    for (const f of accepted) {
      items.push({
        id: ++uid, file: f, name: f.name, size: f.size,
        outName: "", format: "", state: "idle", progress: 0, err: "", data: null,
      });
    }
    render();
    if (accepted.length) {
      dockTitle.textContent = `已选择 ${items.length} 个文件`;
      dockSub.textContent = skipped ? `忽略 ${skipped} 个非 ncm 文件` : "点击开始转换";
    }
  }

  async function walk(entries, out) {
    for (const e of entries) {
      if (e.isFile) {
        const f = await new Promise((res, rej) => e.file(res, rej));
        if (/\.ncm$/i.test(f.name)) out.push(f);
      } else if (e.isDirectory) {
        const r = e.createReader();
        let batch;
        do {
          batch = await new Promise((res, rej) => r.readEntries(res, rej));
          if (batch.length) await walk(batch, out);
        } while (batch.length);
      }
    }
  }

  async function run() {
    if (busy) return;
    const doneList = items.filter((i) => i.state === "done" && i.data);

    if (doneList.length && items.every((i) => i.state === "done" || i.state === "error")) {
      if (doneList.length === 1) {
        const it = doneList[0];
        download(new Blob([it.data], { type: "application/octet-stream" }), it.outName);
      } else {
        const blob = Zip.build(doneList.map((i) => ({ name: i.outName, data: i.data })));
        download(blob, `音乐转换_${new Date().toISOString().slice(0, 10)}.zip`);
      }
      dockSub.textContent = "开始下载…";
      return;
    }

    const queue = items.filter((i) => i.state !== "done");
    if (!queue.length) return;

    busy = true;
    render();
    clearBtn.disabled = true;

    let ok = 0, fail = 0;
    for (let n = 0; n < queue.length; n++) {
      const it = queue[n];
      it.state = "running"; it.progress = 0; it.err = "";
      dockTitle.textContent = "正在转换";
      dockSub.textContent = `${n + 1}/${queue.length} · ${it.name}`;
      render();

      try {
        const buf = await it.file.arrayBuffer();
        const res = await NCM.decode(buf, (p) => {
          it.progress = p;
          setBar((n + p) / queue.length);
          if (Math.round(p * 100) % 4 === 0) render();
        });

        const m = res.meta;
        let title = m && m.musicName ? String(m.musicName) : it.name.replace(/\.ncm$/i, "");
        const ar = artistsOf(m);
        if (ar.length) title = `${title} - ${ar.join(", ")}`;

        it.format = res.format;
        it.data = res.data;
        it.outName = sanitize(title) + "." + res.format;
        it.state = "done";
        ok++;
      } catch (e) {
        it.state = "error";
        it.err = e && e.message ? e.message : String(e);
        fail++;
      }
      render();
      setBar((n + 1) / queue.length);
      await new Promise((r) => setTimeout(r, 12));
    }

    busy = false;
    clearBtn.disabled = false;
    setBar(0);
    dockTitle.textContent = fail ? `完成 ${ok} 个，失败 ${fail} 个` : `转换完成`;
    dockSub.textContent = fail ? "点击失败的项可查看原因" : (ok > 1 ? `点击右下角打包下载` : "点击右下角下载");
    render();
  }

  /* ---- 下载：网页用 a[download]，APK 里走原生桥接（WebView 不支持 blob 下载）---- */
  const NATIVE = typeof window.AndroidBridge !== "undefined" && window.AndroidBridge !== null;

  function bytesToBase64(bytes) {
    let binary = "";
    const step = 0x8000;
    for (let i = 0; i < bytes.length; i += step) {
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i + step));
    }
    return btoa(binary);
  }

  async function saveViaNative(blob, name) {
    const CHUNK = 3 * 1024 * 1024;   // 分块传输，避免大文件在 JS 与原生之间构造巨型字符串
    const total = blob.size;
    let sent = 0;

    if (!window.AndroidBridge.beginFile(name)) {
      throw new Error("无法创建目标文件");
    }

    while (sent < total) {
      const end = Math.min(sent + CHUNK, total);
      const buf = await blob.slice(sent, end).arrayBuffer();
      const ok = window.AndroidBridge.appendChunk(bytesToBase64(new Uint8Array(buf)));
      if (!ok) throw new Error("写入失败，请检查存储空间");
      sent = end;
      dockSub.textContent = `正在保存 ${Math.round((sent / total) * 100)}%`;
      await new Promise((r) => setTimeout(r, 0));
    }

    const msg = window.AndroidBridge.endFile();
    if (msg && msg.indexOf("ERR") === 0) throw new Error(msg.slice(3));
  }

  function download(blob, name) {
    if (NATIVE) {
      dockTitle.textContent = "正在保存到本机";
      saveViaNative(blob, name)
        .then(() => {
          dockTitle.textContent = "已保存";
          dockSub.textContent = "文件在「音乐/音乐转换」文件夹";
        })
        .catch((e) => {
          dockTitle.textContent = "保存失败";
          dockSub.textContent = e.message || String(e);
        });
      return;
    }

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  /* ---- 原生环境适配：WebView 不支持目录选择，隐藏入口并调整文案 ---- */
  if (NATIVE) {
    const pd = $("pickDir");
    if (pd) pd.style.display = "none";
    const hint = document.querySelector(".drop-hint");
    if (hint) hint.textContent = "支持一次选择多个文件";
    // APK 内没有 classic 目录，把外链降级为纯文本，避免点了没反应
    document.querySelectorAll('a[href="classic/"]').forEach((a) => {
      const span = document.createElement("span");
      span.textContent = a.textContent;
      span.style.color = "var(--text-3)";
      a.replaceWith(span);
    });
  }

  /* ---- 事件 ---- */
  $("pickFiles").addEventListener("click", (e) => { e.stopPropagation(); fileInput.click(); });
  $("pickDir").addEventListener("click", (e) => { e.stopPropagation(); dirInput.click(); });
  drop.addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => { addFiles(Array.from(fileInput.files || [])); fileInput.value = ""; });
  dirInput.addEventListener("change", () => { addFiles(Array.from(dirInput.files || [])); dirInput.value = ""; });

  actionBtn.addEventListener("click", run);
  clearBtn.addEventListener("click", () => {
    if (busy) return;
    items = [];
    setBar(0);
    dockTitle.textContent = "准备就绪";
    dockSub.textContent = "";
    render();
  });

  let depth = 0;
  ["dragenter", "dragover"].forEach((ev) => window.addEventListener(ev, (e) => {
    e.preventDefault();
    if (ev === "dragenter") depth++;
    drop.classList.add("over");
  }));
  ["dragleave", "drop"].forEach((ev) => window.addEventListener(ev, (e) => {
    e.preventDefault();
    if (ev === "dragleave") { depth = Math.max(0, depth - 1); if (!depth) drop.classList.remove("over"); }
  }));
  window.addEventListener("drop", async (e) => {
    e.preventDefault();
    depth = 0;
    drop.classList.remove("over");
    const dt = e.dataTransfer;
    if (!dt) return;
    const entries = [];
    if (dt.items) {
      for (const it of dt.items) {
        const en = it.webkitGetAsEntry && it.webkitGetAsEntry();
        if (en) entries.push(en);
      }
    }
    if (entries.length) {
      const files = [];
      await walk(entries, files);
      if (files.length) { addFiles(files); return; }
    }
    addFiles(Array.from(dt.files || []));
  });

  render();
})();
</script>
</body>
</html>
