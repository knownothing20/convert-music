    <script>
        /* 阻断原项目内置的第三方统计上报(stats.ixarea.com),避免访客数据发往第三方服务器。
           在业务代码加载前安装拦截器,不改动已压缩的 app.js,避免破坏其逻辑。 */
        (function () {
            var BLOCKED = /stats\.ixarea\.com/i;
            var hit = function (u) {
                try { return BLOCKED.test(typeof u === "string" ? u : (u && u.url) || ""); }
                catch (e) { return false; }
            };
            if (window.fetch) {
                var of = window.fetch;
                window.fetch = function (input) {
                    if (hit(input)) return Promise.resolve(new Response("", { status: 204 }));
                    return of.apply(this, arguments);
                };
            }
            var XHR = window.XMLHttpRequest;
            if (XHR && XHR.prototype) {
                var oo = XHR.prototype.open;
                XHR.prototype.open = function (m, u) {
                    if (hit(u)) { this.__umBlocked = true; return; }
                    return oo.apply(this, arguments);
                };
                var os = XHR.prototype.send;
                XHR.prototype.send = function () {
                    if (this.__umBlocked) return;
                    return os.apply(this, arguments);
                };
            }
            if (navigator.sendBeacon) {
                var ob = navigator.sendBeacon.bind(navigator);
                navigator.sendBeacon = function (u, d) {
                    if (hit(u)) return true;
                    return ob(u, d);
                };
            }
        })();
    </script>
