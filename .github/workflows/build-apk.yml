name: Build APK

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "manifest.json"
      - "img/**"
      - "android/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Copy web assets into APK
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp manifest.json android/app/src/main/assets/manifest.json
          cp -r img android/app/src/main/assets/img

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk convert-music.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create apk-latest convert-music.apk \
            --title "音乐转换 APK（最新构建）" \
            --notes "由仓库源码自动构建，debug 签名；安装时需允许「未知来源」。" \
            --latest

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: convert-music-apk
          path: convert-music.apk
